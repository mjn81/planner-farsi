<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23513f">
<meta name="robots" content="noindex,nofollow">
<title>Daily Plan · Sign in</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Vazirmatn';font-weight:400;src:url(/assets/fonts/vazirmatn-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'Vazirmatn';font-weight:600;src:url(/assets/fonts/vazirmatn-arabic-600-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'Vazirmatn';font-weight:400;src:url(/assets/fonts/vazirmatn-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-200B,U+2010-206F}
@font-face{font-family:'Vazirmatn';font-weight:600;src:url(/assets/fonts/vazirmatn-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-200B,U+2010-206F}
@font-face{font-family:'Gloock';src:url(/assets/fonts/gloock-latin-400-normal.woff2) format('woff2')}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#efe7d6;color:#23513f;font-family:'Vazirmatn',system-ui,sans-serif}
.card{width:min(100%,400px);background:#fbf5ea;border-radius:20px;padding:32px 26px;box-shadow:0 10px 30px rgba(70,55,30,.14);text-align:center}
.dots{display:inline-grid;grid-template-columns:repeat(3,14px);gap:7px;margin-bottom:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #23513f;display:block}
.dots i.f{background:#d2d26b}
h1{font-family:'Gloock',Georgia,serif;font-weight:400;font-size:2.4rem;margin:0 0 2px;line-height:1.1}
.fa{font-size:1rem;color:#7a8467;margin:0 0 22px}
form{display:flex;flex-direction:column;gap:12px;text-align:start}
label{font-size:.8rem;font-weight:600;color:#7a8467}
input{width:100%;font:inherit;font-size:1rem;padding:13px 14px;border:1.5px solid #bfc5aa;border-radius:12px;background:#fff;color:#23513f;direction:ltr;text-align:start}
input:focus{outline:2px solid #23513f;outline-offset:1px;border-color:#23513f}
button{font:inherit;font-weight:600;background:#23513f;color:#fbf5ea;border:0;border-radius:999px;padding:13px 18px;cursor:pointer;margin-top:4px}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:1.5em;margin:0;font-size:.88rem;color:#a2402f;text-align:center}
</style>
</head>
<body>
<main class="card">
  <div class="dots" aria-hidden="true"><i class="f"></i><i class="f"></i><i></i><i></i><i></i><i></i></div>
  <h1>Daily Plan</h1>
  <p class="fa" dir="rtl" lang="fa">برنامه روزانه</p>
  <form id="f" autocomplete="on">
    <label for="pw">Password · <span lang="fa">رمز عبور</span></label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Enter · <span lang="fa">ورود</span></button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = ''; go.disabled = true;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    if (r.ok) {
      let next = new URLSearchParams(location.search).get('next') || '/';
      if (!next.startsWith('/') || next.startsWith('//') || next.startsWith('/\\')) next = '/';
      location.replace(next);
      return;
    }
    err.textContent = r.status === 503
      ? 'Server not configured (SITE_PASSWORD missing). · رمز عبور روی سرور تنظیم نشده است.'
      : 'Wrong password · رمز عبور اشتباه است';
  } catch {
    err.textContent = 'Connection problem · مشکل در اتصال';
  }
  go.disabled = false;
});
</script>
</body>
</html>
